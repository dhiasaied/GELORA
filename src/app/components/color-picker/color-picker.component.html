<button
  type="button"
  class="trigger"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  aria-controls="palette-panel"
  aria-label="Change the site colors"
>
  <span class="trigger__swatch" [style.background]="theme.palette().gelato"></span>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path
      d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.8 1.7-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.6-.4-1 0-.9.7-1.6 1.6-1.6h1.9A4.6 4.6 0 0 0 21 11.1C21 6.6 17 3 12 3Z"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
    />
    <circle cx="7.5" cy="11" r="1.3" fill="currentColor" />
    <circle cx="10.5" cy="7" r="1.3" fill="currentColor" />
    <circle cx="15" cy="7.5" r="1.3" fill="currentColor" />
  </svg>
</button>

<div class="panel" id="palette-panel" [class.is-open]="open()" role="dialog" aria-label="Flavor palette" [attr.aria-hidden]="!open()">
  <div class="panel__head">
    <span class="eyebrow">Flavor palette</span>
    <p>Every flavor re-tints GELORA, down to the scoop in the 3D scene.</p>
  </div>

  <div class="swatches" role="radiogroup" aria-label="Preset palettes">
    @for (p of theme.palettes; track p.id) {
      <button
        type="button"
        role="radio"
        class="swatch"
        [class.is-active]="theme.palette().id === p.id"
        [attr.aria-checked]="theme.palette().id === p.id"
        [attr.tabindex]="open() ? 0 : -1"
        (click)="pick(p.id)"
        [style.--sw-gelato]="p.gelato"
        [style.--sw-accent]="p.accent"
        [style.--sw-bg]="p.bg"
      >
        <span class="swatch__dot"></span>
        <span class="swatch__name">{{ p.flavor }}</span>
      </button>
    }
  </div>

  <div class="custom">
    <label class="custom__picker" [class.is-active]="theme.palette().id === 'custom'">
      <input type="color" [value]="customHex()" (input)="custom($event)" [attr.tabindex]="open() ? 0 : -1" aria-label="Pick any color" />
      <span class="custom__ring" [style.background]="customHex()"></span>
    </label>
    <input
      class="custom__hex"
      type="text"
      [value]="customHex()"
      (change)="hexInput($event)"
      maxlength="7"
      spellcheck="false"
      aria-label="Hex color"
      [attr.tabindex]="open() ? 0 : -1"
    />
    <button type="button" class="custom__shuffle" (click)="surprise()" [attr.tabindex]="open() ? 0 : -1">Surprise me</button>
  </div>
</div>
